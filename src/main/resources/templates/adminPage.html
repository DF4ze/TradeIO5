<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" th:attr="data-theme=${theme}">
<head th:replace="~{app/fragments :: head(${title})}"></head>
<body class="tio tio-admin" th:attr="data-page=${page},data-mode=${displayMode},data-user=${username}">
<link rel="stylesheet" th:href="@{/assets/app/css/admin-compat.css}">
<div class="tio-app">
  <nav th:replace="~{app/fragments :: nav}"></nav>
  <main class="tio-main" id="app">
    <header class="tio-head">
      <h1>Administration</h1>
      <div class="sub">Welcome in Admin's Page <span th:text="${name}"></span></div>
    </header>
    <div id="admin-root" th:attr="data-username=${name}">
    					<!-- Bandeau permanent (tous onglets) : alimenté par GET /api/admin/execution/state -->
    					<div id="adm-banner" class="alert alert-secondary d-flex flex-wrap align-items-center gap-3 py-2" role="status">
    						<span>Mode : <strong id="adm-mode">—</strong></span>
    						<span>LIVE : <strong id="adm-live">—</strong></span>
    						<span>Clé maître : <strong id="adm-master">—</strong></span>
    						<span>KILL SWITCH : <strong id="adm-ks">—</strong></span>
    						<button type="button" class="btn btn-sm btn-outline-dark" id="adm-ks-toggle" title="Lever ou engager le kill switch, depuis n'importe quel onglet (utile pour le testeur d'ordre)">—</button>
    						<span class="text-muted small" id="adm-caps"></span>
    					</div>
    
    					<div id="adm-alert" class="alert alert-warning d-none" role="alert"></div>
    
    					<ul class="nav nav-tabs" id="adm-tabs" role="tablist">
    						<li class="nav-item" role="presentation">
    							<button type="button" class="nav-link active" id="adm-tab-console" data-adm-tab="console" data-bs-target="#adm-pane-console" role="tab">Console</button>
    						</li>
    						<li class="nav-item" role="presentation">
    							<button type="button" class="nav-link" id="adm-tab-credentials" data-adm-tab="credentials" data-bs-target="#adm-pane-credentials" role="tab">Credentials</button>
    						</li>
    						<li class="nav-item" role="presentation">
    							<button type="button" class="nav-link" id="adm-tab-bindings" data-adm-tab="bindings" data-bs-target="#adm-pane-bindings" role="tab">Bindings</button>
    						</li>
    						<li class="nav-item" role="presentation">
    							<button type="button" class="nav-link" id="adm-tab-orderTester" data-adm-tab="orderTester" data-bs-target="#adm-pane-orderTester" role="tab">Testeur d'ordre</button>
    						</li>
    						<li class="nav-item" role="presentation">
    							<button type="button" class="nav-link" id="adm-tab-journal" data-adm-tab="journal" data-bs-target="#adm-pane-journal" role="tab">Journal</button>
    						</li>
    						<li class="nav-item" role="presentation">
    							<button type="button" class="nav-link" id="adm-tab-modulation" data-adm-tab="modulation" data-bs-target="#adm-pane-modulation" role="tab">Modulation</button>
    						</li>
    					</ul>
    
    					<div class="tab-content pt-3">
    						<div th:replace="~{fragments/admin/console :: console}"></div>
    						<div th:replace="~{fragments/admin/credentials :: credentials}"></div>
    						<div th:replace="~{fragments/admin/bindings :: bindings}"></div>
    						<div th:replace="~{fragments/admin/orderTester :: orderTester}"></div>
    						<div th:replace="~{fragments/admin/modulation :: modulation}"></div>
    						<div th:replace="~{fragments/admin/journal :: journal}"></div>
    					</div>
    				</div>
  </main>
</div>
<script th:src="@{/assets/js/admin/admin-core.js}"></script>
<script th:src="@{/assets/js/admin/console.js}"></script>
<script th:src="@{/assets/js/admin/credentials.js}"></script>
<script th:src="@{/assets/js/admin/bindings.js}"></script>
<script th:src="@{/assets/js/admin/orderTester.js}"></script>
<script th:src="@{/assets/js/admin/modulation.js}"></script>
<script th:src="@{/assets/js/admin/journal.js}"></script>
<script th:src="@{/assets/app/js/admin-tabs.js}"></script>
<script>AdminCore.start();</script>
</body>
</html>
