<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhml" xmlns:th="http://www.thymeleaf.org">
    
    <head>
        <meta charset="UTF-8">
        <title>Page Accessible for all</title>
        
    		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
		
		<!-- Vendor CSS Files -->
		<link href="assets/vendor/aos/aos.css" rel="stylesheet">
		<link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
		<link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
		<link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
		<link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
		<link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
		
		<!-- Template Main CSS File -->
		<link href="assets/css/style.css" rel="stylesheet">
		
		<!-- Jquery Call -->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    </head>
    <body>
    
    
      <!-- ======= Header ======= -->
	<header id="header">
	  <div class="d-flex flex-column">
	
	    <div class="profile">
	    </div>
	
		<nav id="navbar" class="nav-menu navbar">
			<div th:replace="~{fragments/navbar :: navbar}"></div>
		</nav>
	  </div>
	</header>
    
    
    
    <main id="main">
		<!-- ======= Page Admin d'exécution : bandeau permanent + onglets ======= -->
		<section id="about" class="about" >
		  	<div class="container">
		    	<div class="section-title">
    				Welcome in Admin's Page <span th:text="${name}" ></span>
    			</div>

				<div id="admin-root" th:attr="data-username=${name}">
					<!-- Bandeau permanent (tous onglets) : alimenté par GET /api/admin/execution/state -->
					<div id="adm-banner" class="alert alert-secondary d-flex flex-wrap align-items-center gap-3 py-2" role="status">
						<span>Mode : <strong id="adm-mode">—</strong></span>
						<span>LIVE : <strong id="adm-live">—</strong></span>
						<span>Clé maître : <strong id="adm-master">—</strong></span>
						<span>KILL SWITCH : <strong id="adm-ks">—</strong></span>
						<span class="text-muted small" id="adm-caps"></span>
					</div>

					<div id="adm-alert" class="alert alert-warning d-none" role="alert"></div>

					<ul class="nav nav-tabs" id="adm-tabs" role="tablist">
						<li class="nav-item" role="presentation">
							<button type="button" class="nav-link active" id="adm-tab-console" data-adm-tab="console" data-bs-toggle="tab" data-bs-target="#adm-pane-console" role="tab">Console</button>
						</li>
						<li class="nav-item" role="presentation">
							<button type="button" class="nav-link" id="adm-tab-credentials" data-adm-tab="credentials" data-bs-toggle="tab" data-bs-target="#adm-pane-credentials" role="tab">Credentials</button>
						</li>
						<li class="nav-item" role="presentation">
							<button type="button" class="nav-link" id="adm-tab-bindings" data-adm-tab="bindings" data-bs-toggle="tab" data-bs-target="#adm-pane-bindings" role="tab">Bindings</button>
						</li>
						<li class="nav-item" role="presentation">
							<button type="button" class="nav-link" id="adm-tab-orderTester" data-adm-tab="orderTester" data-bs-toggle="tab" data-bs-target="#adm-pane-orderTester" role="tab">Testeur d'ordre</button>
						</li>
						<li class="nav-item" role="presentation">
							<button type="button" class="nav-link" id="adm-tab-journal" data-adm-tab="journal" data-bs-toggle="tab" data-bs-target="#adm-pane-journal" role="tab">Journal</button>
						</li>
					</ul>

					<div class="tab-content pt-3">
						<div th:replace="~{fragments/admin/console :: console}"></div>
						<div th:replace="~{fragments/admin/credentials :: credentials}"></div>
						<div th:replace="~{fragments/admin/bindings :: bindings}"></div>
						<div th:replace="~{fragments/admin/orderTester :: orderTester}"></div>
						<div th:replace="~{fragments/admin/journal :: journal}"></div>
					</div>
				</div>
			</div>
		</section>
	</main>



		<!-- Vendor JS Files -->
		<script src="assets/vendor/purecounter/purecounter_vanilla.js"></script>
		<script src="assets/vendor/aos/aos.js"></script>
		<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
		<script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
		<script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
		<script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
		<script src="assets/vendor/typed.js/typed.min.js"></script>
		<script src="assets/vendor/waypoints/noframework.waypoints.js"></script>
		<script src="assets/vendor/php-email-form/validate.js"></script>
		
		<!-- Template Main JS File -->
		 <script src="assets/js/main.js"></script>
		 <script src="assets/js/perso.js"></script>
		
		<!-- Page Admin : un fichier par onglet, données chargées à la première ouverture de l'onglet -->
		<script src="assets/js/admin/admin-core.js"></script>
		<script src="assets/js/admin/console.js"></script>
		<script src="assets/js/admin/credentials.js"></script>
		<script src="assets/js/admin/bindings.js"></script>
		<script src="assets/js/admin/orderTester.js"></script>
		<script src="assets/js/admin/journal.js"></script>
		<script>AdminCore.start();</script>

	</body>
</html>
