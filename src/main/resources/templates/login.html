<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/public :: head('Connexion')}"></head>
<body class="tio pub">
<header th:replace="~{fragments/public :: topbar(false)}"></header>
<main id="contenu" class="pub-auth">
  <section class="card pub-auth-card" aria-labelledby="t">
    <h1 id="t">Connexion</h1>
    <p class="muted">Retrouvez votre tableau de bord.</p>
    <div class="banner banner--down" role="alert" th:if="${error}">Identifiant ou mot de passe invalide.</div>
    <form class="stack" method="post" th:action="@{/api/auth/signinForm}" th:object="${loginRequest}">
      <div class="field"><label for="userName">Identifiant</label>
        <input type="text" th:field="*{userName}" autocomplete="username" autocapitalize="none" required autofocus></div>
      <div class="field"><label for="password">Mot de passe</label>
        <input type="password" th:field="*{password}" autocomplete="current-password" required></div>
      <button class="btn btn--primary btn--lg" type="submit">Se connecter</button>
    </form>
    <p class="note">Pas encore de compte ? <a th:href="@{/register}">Inscription</a></p>
    <p class="note"><a th:href="@{/}">← Retour à l'accueil</a></p>
  </section>
</main>
</body>
</html>
