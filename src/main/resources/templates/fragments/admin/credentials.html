<div th:fragment="credentials" class="tab-pane fade" id="adm-pane-credentials" role="tabpanel">
	<h5>Credentials</h5>
	<div id="adm-master-warning" class="alert alert-danger d-none" role="alert"></div>
	<div class="table-responsive">
		<table class="table table-sm align-middle">
			<thead>
				<tr><th>Id</th><th>Utilisateur</th><th>Exchange</th><th>Portée</th><th>Actif</th><th>Créée le</th><th>Clé (fin)</th><th></th></tr>
			</thead>
			<tbody id="adm-cred-body"></tbody>
		</table>
	</div>

	<h6 class="mt-4">Saisir / remplacer ma clé TRADE</h6>
	<p class="text-muted small">Chiffrée au repos. Les valeurs ne sont jamais ré-affichées. Droit Trade au comptant uniquement, jamais de retrait.</p>
	<form id="adm-cred-form" autocomplete="off" class="row g-2">
		<div class="col-12 col-md-3">
			<label class="form-label" for="adm-cred-provider">Exchange</label>
			<select class="form-select" id="adm-cred-provider"><option value="OKX">OKX</option><option value="KRAKEN">Kraken</option></select>
		</div>
		<div class="col-12 col-md-3">
			<label class="form-label" for="adm-cred-apikey">Clé API</label>
			<input type="password" class="form-control" id="adm-cred-apikey" autocomplete="off" required>
		</div>
		<div class="col-12 col-md-3">
			<label class="form-label" for="adm-cred-secret">Clé secrète</label>
			<input type="password" class="form-control" id="adm-cred-secret" autocomplete="off" required>
		</div>
		<div class="col-12 col-md-3" id="adm-cred-pass-group">
			<label class="form-label" for="adm-cred-pass">Passphrase</label>
			<input type="password" class="form-control" id="adm-cred-pass" autocomplete="off" required>
		</div>
		<div class="col-12">
			<div class="alert alert-info small mb-0" id="adm-cred-hint" role="note"></div>
		</div>
		<div class="col-12">
			<div class="form-check">
				<input class="form-check-input" type="checkbox" id="adm-cred-enabled" checked>
				<label class="form-check-label" for="adm-cred-enabled">Activée</label>
			</div>
		</div>
		<div class="col-12">
			<button type="submit" class="btn btn-primary" id="adm-cred-submit">Enregistrer</button>
			<span class="small ms-2" id="adm-cred-status"></span>
		</div>
	</form>
</div>
