<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/public :: head('Inscription')}"></head>
<body class="tio pub">
<header th:replace="~{fragments/public :: topbar(false)}"></header>
<main id="contenu" class="pub-auth">
  <section class="card pub-auth-card" aria-labelledby="t">
    <h1 id="t">Inscription</h1>
    <p class="muted">Créez votre compte TradeIO.</p>
    <div class="banner" role="status" th:if="${ok}">Compte créé. <a th:href="@{/login}">Se connecter</a></div>
    <div class="banner banner--down" role="alert" th:if="${exception != null}" th:text="${exception}">Erreur</div>
    <div class="banner banner--down" role="alert" th:if="${errors != null and !errors.isEmpty()}">
      <ul class="pub-errs"><li th:each="e : ${errors}" th:text="${e}">erreur</li></ul>
    </div>
    <form class="stack" method="post" th:action="@{/api/auth/signupForm}" th:object="${signUpRequest}" th:unless="${ok}">
      <div class="field"><label for="username">Identifiant</label>
        <input type="text" th:field="*{username}" autocomplete="username" autocapitalize="none" minlength="3" maxlength="20" required>
        <span class="hint">3 à 20 caractères.</span></div>
      <div class="field"><label for="email">E-mail</label>
        <input type="email" th:field="*{email}" autocomplete="email" maxlength="50" required></div>
      <div class="field"><label for="password">Mot de passe</label>
        <input type="password" th:field="*{password}" autocomplete="new-password" minlength="6" maxlength="40" required>
        <span class="hint">6 à 40 caractères.</span></div>
      <div class="field"><label for="verifPassword">Confirmation du mot de passe</label>
        <input type="password" th:field="*{verifPassword}" autocomplete="new-password" minlength="6" maxlength="40" required></div>
      <button class="btn btn--primary btn--lg" type="submit">Créer mon compte</button>
    </form>
    <p class="note">Déjà un compte ? <a th:href="@{/login}">Connexion</a></p>
    <p class="note"><a th:href="@{/}">← Retour à l'accueil</a></p>
  </section>
</main>
</body>
</html>
